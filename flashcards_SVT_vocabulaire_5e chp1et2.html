const cardEl=document.getElementById('card'), labelEl=document.getElementById('faceLabel'), contentEl=document.getElementById('faceContent'), hintEl=document.getElementById('hint'), counterEl=document.getElementById('counter'), chapterEl=document.getElementById('chapter'), liveEl=document.getElementById('live'), printArea=document.getElementById('printArea');

function escapeText(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function makePrint(){const perPage=9;let sheets='';for(let start=0,page=0;start<cards.length;start+=perPage,page++){const batch=cards.slice(start,start+perPage);const chapterNums=[...new Set(batch.map(x=>x.chapter))];const chapterText=chapterNums.length===1?(chapterNums[0]===1?'Chapitre 1 · La Terre et ses climats':'Chapitre 2 · Climats, météo et risques naturels'):'Chapitres 1 et 2';const front=batch.map(x=>`<div class="print-card"><span class="print-label">Définition · ${x.chapter===1?'chapitre 1':'chapitre 2'}</span><span class="print-def">${escapeText(x.definition.trim())}</span>${safeSvg(x.icon)}</div>`);while(front.length<9)front.push('<div class="print-card"></div>');const back=[];for(let r=0;r<3;r++){for(let col=2;col>=0;col--){const it=batch[r*3+col];back.push(it?`<div class="print-card"><span class="print-label">Terme scientifique</span><span class="print-term ${it.term.length>17?'long':''}">${escapeText(it.term)}</span></div>`:'<div class="print-card"></div>')}}for(const [side,content,sideOffset] of [['Rectos · définitions',front.join(''),0],['Versos · termes scientifiques',back.join(''),1]]){sheets+=`<section class="sheet"><header class="sheet-head"><strong>SVT 5e · Flashcards</strong><span>${chapterText} · ${side}</span></header><div class="grid">${content}</div><footer class="sheet-foot"><span>Imprimer en recto-verso · retourner sur le bord long</span><span>${page*2+sideOffset+1} / ${Math.ceil(cards.length/perPage)*2}</span></footer></section>`}}
